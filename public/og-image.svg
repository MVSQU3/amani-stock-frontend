<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Fond : même que la landing #0a0a0b -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#10100e"/>
    </linearGradient>
    <!-- Accent amber : même que la landing #f5a524 → #f97316 -->
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f5a524"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <!-- Glow doux -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Halos décoratifs -->
  <circle cx="1100" cy="80" r="280" fill="#f5a524" opacity="0.06" filter="url(#glow)"/>
  <circle cx="100" cy="560" r="200" fill="#f97316" opacity="0.05" filter="url(#glow)"/>

  <!-- Barre amber en haut (6px, même que l'accent de la landing) -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#amber)"/>

  <!-- ── LOGO (éclair Amani, reproduit du favicon) ─────────────────────── -->
  <g transform="translate(88, 195) scale(2.6)">
    <path d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" fill="url(#amber)"/>
  </g>

  <!-- ── TEXTES ──────────────────────────────────────────────────────────── -->
  <!-- Nom produit -->
  <text x="240" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="76" font-weight="700" fill="#f4f3f1" letter-spacing="-2">Amani Stock</text>

  <!-- Slogan -->
  <text x="240" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="30" font-weight="400" fill="#9b9ba3">
    Gestion de stock pour boutiques africaines
  </text>

  <!-- Ligne séparatrice amber -->
  <rect x="240" y="362" width="720" height="2" fill="url(#amber)" opacity="0.5" rx="1"/>

  <!-- ── CARTES FEATURES (fond #141417, bord #2a2a30) ──────────────────── -->

  <!-- Carte 1 : Suivi FEFO -->
  <rect x="100" y="406" width="300" height="150" rx="14" fill="#141417" stroke="#2a2a30" stroke-width="1.5"/>
  <!-- Icône horloge (clock) -->
  <g transform="translate(230, 445)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#f5a524" stroke-width="2"/>
    <line x1="20" y1="20" x2="20" y2="8"  stroke="#f5a524" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="29" y2="25" stroke="#f5a524" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="2" fill="#f5a524"/>
  </g>
  <text x="250" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="600" fill="#f4f3f1" text-anchor="middle">Suivi FEFO</text>
  <text x="250" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" fill="#6f6f78" text-anchor="middle">Premier expiré, premier sorti</text>

  <!-- Carte 2 : Alertes péremption -->
  <rect x="450" y="406" width="300" height="150" rx="14" fill="#141417" stroke="#2a2a30" stroke-width="1.5"/>
  <!-- Icône cloche (bell) -->
  <g transform="translate(580, 442)">
    <!-- Corps de la cloche -->
    <path d="M20 4 C12 4 6 10 6 18 L6 26 L34 26 L34 18 C34 10 28 4 20 4 Z"
          fill="none" stroke="#f5a524" stroke-width="2" stroke-linejoin="round"/>
    <!-- Battant -->
    <path d="M16 26 C16 28.2 17.8 30 20 30 C22.2 30 24 28.2 24 26"
          fill="none" stroke="#f5a524" stroke-width="2" stroke-linecap="round"/>
    <!-- Trait du haut -->
    <line x1="20" y1="1" x2="20" y2="4" stroke="#f5a524" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="600" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="600" fill="#f4f3f1" text-anchor="middle">Alertes péremption</text>
  <text x="600" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" fill="#6f6f78" text-anchor="middle">Prévenu avant la date limite</text>

  <!-- Carte 3 : Scanner codes-barres -->
  <rect x="800" y="406" width="300" height="150" rx="14" fill="#141417" stroke="#2a2a30" stroke-width="1.5"/>
  <!-- Icône scan / code-barres -->
  <g transform="translate(930, 440)">
    <!-- Coin haut-gauche -->
    <path d="M0 10 L0 0 L10 0" fill="none" stroke="#f5a524" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Coin haut-droit -->
    <path d="M30 0 L40 0 L40 10" fill="none" stroke="#f5a524" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Coin bas-gauche -->
    <path d="M0 30 L0 40 L10 40" fill="none" stroke="#f5a524" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Coin bas-droit -->
    <path d="M30 40 L40 40 L40 30" fill="none" stroke="#f5a524" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Barres verticales intérieures -->
    <line x1="9"  y1="13" x2="9"  y2="27" stroke="#f5a524" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="13" x2="14" y2="27" stroke="#f5a524" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="13" x2="18" y2="27" stroke="#f5a524" stroke-width="3"   stroke-linecap="round"/>
    <line x1="23" y1="13" x2="23" y2="27" stroke="#f5a524" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="28" y1="13" x2="28" y2="27" stroke="#f5a524" stroke-width="2"   stroke-linecap="round"/>
    <line x1="32" y1="13" x2="32" y2="27" stroke="#f5a524" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="950" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="600" fill="#f4f3f1" text-anchor="middle">Scanner codes-barres</text>
  <text x="950" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" fill="#6f6f78" text-anchor="middle">Entrées et sorties rapides</text>

  <!-- ── URL en bas ─────────────────────────────────────────────────────── -->
  <text x="600" y="598" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" fill="#3a3a40" text-anchor="middle" letter-spacing="1">amani-stock.pro</text>
</svg>
