<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO principal ─────────────────────────────────────────────── -->
    <title>Amani Stock — Gestion de stock pour boutiques africaines</title>
    <meta
      name="description"
      content="Amani Stock simplifie la gestion de stock pour les boutiques et pharmacies en Afrique de l'Ouest. Suivi FEFO, alertes de péremption, scanner de codes-barres et tableau de bord en temps réel."
    />
    <meta
      name="keywords"
      content="gestion de stock, inventaire, FEFO, péremption, codes-barres, boutique, pharmacie, Afrique de l'Ouest, FCFA"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://amani-stock.pro/" />

    <!-- ── Favicon ────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f5a524" />

    <!-- ── Open Graph (Facebook, WhatsApp, LinkedIn…) ────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://amani-stock.pro/" />
    <meta
      property="og:title"
      content="Amani Stock — Gestion de stock pour boutiques africaines"
    />
    <meta
      property="og:description"
      content="Gérez votre inventaire en toute simplicité : suivi FEFO, alertes de péremption, scanner de codes-barres et tableau de bord en temps réel."
    />
    <meta property="og:image" content="https://amani-stock.pro/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Amani Stock" />

    <!-- ── Twitter / X Card ──────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Amani Stock — Gestion de stock pour boutiques africaines"
    />
    <meta
      name="twitter:description"
      content="Gérez votre inventaire en toute simplicité : suivi FEFO, alertes de péremption, scanner de codes-barres."
    />
    <meta name="twitter:image" content="https://amani-stock.pro/og-image.png" />

    <!-- ── Données structurées JSON-LD (Google Rich Results) ─────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Amani Stock",
        "url": "https://amani-stock.pro/",
        "description": "Application de gestion de stock pour boutiques et pharmacies en Afrique de l'Ouest. Suivi FEFO, alertes de péremption, scanner de codes-barres.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "XOF"
        },
        "inLanguage": "fr",
        "audience": {
          "@type": "Audience",
          "audienceType": "Commerçants, gérants de boutiques, pharmacies"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
